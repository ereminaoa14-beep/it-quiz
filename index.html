<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111a42">
  <title>Кто ты в IT? — сканируй QR и проходи тест</title>
  <style>
    :root { --ink:#f2f7ff; --muted:#a5b2cc; --card:rgba(10,22,45,.88); --line:rgba(167,197,229,.22); --cyan:#49dbff; --violet:#7586ff; --yellow:#a7ff71; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:16px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:var(--ink); background:#050b18; }
    body::before, body::after { content:""; position:fixed; z-index:-1; width:46vw; height:46vw; border-radius:50%; filter:blur(70px); opacity:.35; }
    body::before { background:#164c9c; top:-20vw; left:-18vw; } body::after { background:#087b67; right:-18vw; bottom:-19vw; }
    body { background-image:linear-gradient(rgba(118,163,213,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(118,163,213,.055) 1px,transparent 1px); background-size:32px 32px; }
    main { width:min(720px, calc(100% - 32px)); margin:auto; padding:48px 0; }
    .brand { display:flex; align-items:center; gap:12px; color:var(--cyan); font-weight:800; letter-spacing:.06em; text-transform:uppercase; font-size:.78rem; }
    .logo { display:grid; place-items:center; width:36px; height:36px; border:1px solid var(--cyan); border-radius:12px; font-size:13px; box-shadow:0 0 24px #36dff277; }
    .card { margin-top:25px; padding:clamp(24px, 5vw, 46px); border:1px solid var(--line); border-radius:28px; background:linear-gradient(145deg, rgba(20,45,80,.9), var(--card)); box-shadow:0 24px 90px #0009; backdrop-filter:blur(14px); text-align:center; }
    h1 { margin:12px 0 15px; font-size:clamp(2rem, 6vw, 3.6rem); line-height:1; letter-spacing:-.035em; }
    p { color:var(--muted); margin:0 0 22px; }
    .qr-wrap { margin:26px auto; padding:16px; width:min(320px, 100%); border-radius:20px; background:#fff; box-shadow:0 12px 40px #0008; }
    .qr-wrap img { display:block; width:100%; height:auto; border-radius:8px; }
    .caption { color:var(--yellow); font-weight:800; font-size:.9rem; letter-spacing:.05em; margin-bottom:6px; }
    .actions { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
    button, a.btn { appearance:none; padding:14px 22px; border:0; border-radius:14px; cursor:pointer; font:inherit; font-weight:800; text-decoration:none; color:#07102c; background:linear-gradient(135deg, var(--cyan), #8191ff); box-shadow:0 10px 28px #55d9ff55; transition:transform .18s, box-shadow .18s; }
    button,a.btn:hover { transform:translateY(-2px); }
    .ghost { background:transparent; border:1px solid var(--line); color:var(--ink); }
    .hint { margin-top:26px; font-size:.82rem; color:#7380b7; }
    @media print { body { background:#fff; color:#111; } .card { box-shadow:none; border:1px solid #ccc; } .no-print { display:none !important; } }
  </style>
</head>
<body>
  <main>
    <div class="brand"><span class="logo">&lt;/&gt;</span> IT-навигация</div>
    <section class="card">
      <h1>Кто ты в IT?</h1>
      <p>Наведи камеру телефона на QR-код и пройди профориентационный тест — узнаешь, какое IT-направление тебе подойдёт.</p>
      <div class="caption">Сканируй здесь:</div>
      <div class="qr-wrap"><img src="qr-code.png" alt="QR-код для прохождения теста Кто ты в IT?"></div>
      <div class="actions">
        <a class="btn" href="it-career-quiz.html">Открыть тест на этом устройстве →</a>
        <a class="btn ghost" href="qr-code.png" download="qr-kto-ty-v-it.png" class="no-print">Скачать QR-код</a>
      </div>
      <div class="hint">QR ведёт на локальный адрес этой сети: http://192.168.1.10:8000/it-career-quiz.html</div>
    </section>
  </main>
</body>
</html>
